spring.application.name=soluLab4

spring.datasource.url=jdbc:mysql://localhost:3306/hr?serverTimezone=America/Lima&useSSL=false&publicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678

# 3. Driver de conexión (Ya lo tienes en tu classpath v8.0.32)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Configuración para ver las consultas SQL en la consola (Nivel de Élite)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

