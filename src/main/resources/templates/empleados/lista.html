
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>


<body class="bg-light">

<div th:insert="fragments/menu.html :: menu_superior"></div>

<div class="container mt-5 shadow-sm p-4 bg-white rounded">

<h2>Empleados Totales</h2>
<a class="btn btn-primary mt-4 mb-4" th:href="@{'/empleados/nuevo'}">Nuevo Empleado</a>
<form method="get" th:action="@{'/empleados/lista'}" class="d-flex gap-2">
    <input name="buscar" type="search" class="form-control"
           placeholder="Buscar por nombre, apellido, puesto o ciudad..."
           th:value="${busquedaAnterior}">
    <button class="btn btn-outline-secondary" type="submit">Buscar</button>
    <a th:href="@{'/empleados/lista'}" class="btn btn-link">Limpiar</a>
</form>
<table class="table table-sm">
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Puesto</th>
        <th>Departamento</th>
        <th>Ciudad</th>
        <th></th>
        <th></th>
    </tr>
    <tr th:each="emp, info : ${listaEmpleados}">
        <td th:text="${info.index +1}"></td>
        <td th:text="${emp.first_name}"></td>
        <td th:text="${emp.last_name}"></td>
        <td th:text="${emp.job.jobtitle}"></td>
        <td th:text="${emp.department.departmentname}"></td>
        <td th:text="${emp.department.location.city}"></td>
        <td><a class="btn btn-primary"
               th:href="@{'/empleados/editar' + '?id=' + ${emp.id}}">Editar</a></td>
        <td><a class="btn btn-danger"
               th:href="@{'/empleados/borrar' + '?id=' + ${emp.id}}">Borrar</a></td>
    </tr>
</table>
</div>
</body>
</html>
