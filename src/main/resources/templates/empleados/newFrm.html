<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>
<body>

<h2>Nuevo Empleado</h2>
<form method="post" th:action="@{'/empleados/nuevo'}">
<!--    <input th:value="${emp.id}" name="id" type="hidden">-->
    <div class="form-group">
        <label for="first_name">Nombre</label>
        <input name="first_name" type="text" class="form-control" id="first_name" >
    </div>
    <div class="form-group">
        <label for="last_name">Apellido</label>
        <input name="last_name" type="text" class="form-control" id="last_name" >
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input name="email" type="text" class="form-control" id="email" >
    </div>
    <div class="form-group">
        <label for="password">Contraseña</label>
        <input name="password" type="text" class="form-control" id="password" >
    </div>
    <div class="form-group">
        <label for="jobId">Puesto</label>
        <select name="jobId" id="jobId" class="form-select">
            <option value="" selected disabled>-- Elija un puesto --</option>
            <option th:each="job : ${listaJobs}"
                    th:value="${job.id}"
                    th:text="${job.jobtitle}"></option>
        </select>
        <!--        <input th:value="${employee.job.jobtitle}" name="jobtitle" type="text" class="form-control" id="jobtitle" >-->
    </div>
    <div class="form-group">
        <label for="salary">Sueldo</label>
        <input name="salary" type="number" class="form-control" id="salary" >
    </div>
    <div class="form-group">
        <label for="manager_id">Departamento</label>
        <select id="manager_id" name="manager_id" class="form-select">
            <option value="" selected disabled>-- Elija un jefe --</option>
            <option th:each="o : ${listaEmployees}"
                    th:value="${o.id}"
                    th:text="${o.first_name} + ' '+${o.last_name}"></option>
        </select>
        <!--        <input th:value="${employee.department.departmentname}" name="departmentname" type="text" class="form-control" id="departmentname" >-->
    </div>
    <div class="form-group">
        <label for="depId">Departamento</label>

        <select id="depId" name="depId" class="form-select">
            <option value="" selected disabled>-- Elija un departamento --</option>
            <option th:each="dep : ${listaDepartments}"
                    th:value="${dep.id}"
                    th:text="${dep.departmentname}"></option>
        </select>
        <!--        <input th:value="${employee.department.departmentname}" name="departmentname" type="text" class="form-control" id="departmentname" >-->
    </div>
    <

    <a th:href="@{'/empleados/lista'}" class="btn btn-danger">Cancelar</a>
    <button type="submit" class="btn btn-primary">Guardar</button>

</form>

</body>
</html>
